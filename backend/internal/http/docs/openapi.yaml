  /api/v1/events:
    get:
      description: Long-lived SSE stream of download / import / scan progress and other real-time events. Each event has an `event` name (one of the discriminated set below), an optional `id`, and a JSON `data` payload.
      operationId: events-stream
      parameters:
        - description: Filter to specific event names; repeatable. Empty = all events.
          explode: true
          in: query
          name: type
          schema:
            description: Filter to specific event names; repeatable. Empty = all events.
            items:
              type: string
            type:
              - array
              - "null"
      responses:
        "200":
          content:
            text/event-stream:
              schema:
                description: Each oneOf object in the array represents one possible Server Sent Events (SSE) message, serialized as UTF-8 text according to the SSE specification.
                items:
                  oneOf:
                    - properties:
                        data: {}
                        event:
                          const: download_job_updated
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
                      required:
                        - data
                        - event
                      title: Event download_job_updated
                      type: object
                    - properties:
                        data: {}
                        event:
                          const: download_jobs_snapshot
                          description: The event name.
                          type: string
                        id:
                          description: The event ID.
                          type: integer
                        retry:
                          description: The retry time in milliseconds.
                          type: integer
