components:
  schemas:
    Action:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/Action.json
          format: uri
          readOnly: true
          type: string
        createdAt:
          format: date-time
          type: string
        id:
          type: string
        order:
          format: int32
          type: integer
        policyId:
          type: string
        type:
          type: string
        updatedAt:
          format: date-time
          type: string
        value:
          type: string
      required:
        - id
        - policyId
        - type
        - value
        - order
        - createdAt
        - updatedAt
      type: object
    ActionInfo:
      additionalProperties: false
      properties:
        order:
          format: int32
          type: integer
        type:
          type: string
        value:
          type: string
      required:
        - type
        - value
        - order
      type: object
    ActionWriteBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/ActionWriteBody.json
          format: uri
          readOnly: true
          type: string
        order:
          description: Order within the policy's action list
          format: int32
          type: integer
        type:
          description: Action type
          minLength: 1
          type: string
        value:
          description: Action value
          type: string
      required:
        - type
        - value
        - order
      type: object
    Availability:
      additionalProperties: false
      properties:
        isInLibrary:
          type: boolean
        libraries:
          items:
            $ref: "#/components/schemas/LibraryAvailability"
          type:
            - array
            - "null"
      required:
        - isInLibrary
        - libraries
      type: object
    BootstrapConfig:
      additionalProperties: false
      properties:
        signupStrategy:
          description: Configured signup strategy (open / invite_only)
          type: string
        siteTitle:
          description: Display name of the site
          type: string
        version:
          description: Build version string
          type: string
      required:
        - siteTitle
        - signupStrategy
        - version
      type: object
    BootstrapResponse:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/schemas/BootstrapResponse.json
          format: uri
          readOnly: true
          type: string
        config:
          $ref: "#/components/schemas/BootstrapConfig"
          description: Public app config
        initialized:
          description: Whether the system has completed setup
          type: boolean
        setup:
          $ref: "#/components/schemas/SetupSteps"
          description: Per-step setup completion (only present when not yet initialized)
        user:
          $ref: "#/components/schemas/BootstrapUser"
          description: Authenticated principal, when a valid token was supplied; null otherwise
      required:
        - initialized
        - user
        - config
      type: object
    BootstrapUser:
      additionalProperties: false
      properties:
        email:
          description: Email from JWT claims
          type:
            - string
            - "null"
        id:
          description: User id (JWT subject)
          type: string
        username:
          description: Username from JWT claims
          type:
            - string
            - "null"
      required:
        - id
        - email
        - username
      type: object
    Capabilities:
      additionalProperties: false
