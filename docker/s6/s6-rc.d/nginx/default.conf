server {
  listen 8484;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Content-hashed build output: the filename changes whenever the bytes do,
  # so these are safe to cache immutably at the edge (Cloudflare) and in the
  # browser. Covers Vite's /assets/* and the workbox runtime.
  location ~* ^/(assets/|workbox-[^/]+\.js$) {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page app. Everything served here keeps a stable URL across builds but
  # changes on redeploy — index.html, sw.js, registerSW.js, manifest, icons.
  # no-cache forces revalidation so neither Cloudflare nor the browser pins a
  # client to a stale shell or service worker (autoUpdate can only act on a
  # sw.js it's actually allowed to re-fetch).
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }

  # SSE event stream -> Go API on 127.0.0.1:8080
  # More-specific prefix wins over /api/; buffering must be off so events
  # flush to the client immediately instead of sitting in nginx's buffer.
  location /api/v1/events {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding off;
  }

  # API reverse proxy -> Go API on 127.0.0.1:8080
  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
  }
}
