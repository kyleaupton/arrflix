server {
  listen 8484;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Single-page app
  location / {
    try_files $uri $uri/ /index.html;
  }

  # SSE event stream -> Go API on 127.0.0.1:8080
  # More-specific prefix wins over /api/; buffering must be off so events
  # flush to the client immediately instead of sitting in nginx's buffer.
  location /api/v1/events {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    chunked_transfer_encoding off;
  }

  # API reverse proxy -> Go API on 127.0.0.1:8080
  location /api/ {
    proxy_pass http://127.0.0.1:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_http_version 1.1;
  }
}
