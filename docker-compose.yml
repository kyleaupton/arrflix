services:
  arrflix-dev:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    image: arrflix:dev
    container_name: arrflix-dev
    environment:
      APP_ENV: dev
      TMDB_API_KEY: ${TMDB_API_KEY}
    ports:
      - "8484:8484" # Application (required)
      - "9696:9696" # Prowlarr (for debugging)
      - "5432:5432" # Postgres (for debugging)
    volumes:
      - ${MEDIA_LIBRARIES}:/data
      - /tmp/fake-media:/tmp/fake-media
      - ./.data/postgres-data:/var/lib/postgresql/data

      # Application code for dev
      - ./web:/app/web
      - /app/web/node_modules # container manages its own Linux-native node_modules
      - ./backend:/app/backend
